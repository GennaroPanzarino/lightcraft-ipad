name: LightCraftTether
options:
  bundleIdPrefix: com.lightcraft
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "2"
    IPHONEOS_DEPLOYMENT_TARGET: "15.0"
    ENABLE_BITCODE: NO
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: ""
    DEAD_CODE_STRIPPING: YES
targets:
  LightCraftTether:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Fonts
        buildPhase: resources
      - path: App/Assets.xcassets
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: LightCraft
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UIAppFonts:
          - inter_regular.ttf
          - inter_medium.ttf
          - inter_semibold.ttf
          - inter_bold.ttf
          - inter_display_semibold.ttf
        NSLocalNetworkUsageDescription: "LightCraft si collega alla fotocamera sulla sua rete Wi-Fi."
        NSPhotoLibraryAddUsageDescription: "LightCraft salva nella libreria Foto le immagini che esporti."
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: false
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/LightCraftTether.entitlements
      properties:
        com.apple.developer.networking.HotspotConfiguration: true
        com.apple.developer.networking.wifi-info: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lightcraft.tether
        PRODUCT_NAME: LightCraftTether
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_BRIDGING_HEADER: App/Bridging.h
        HEADER_SEARCH_PATHS: $(PROJECT_DIR)/App
        LIBRARY_SEARCH_PATHS: $(PROJECT_DIR)/lib/$(PLATFORM_NAME)
        OTHER_LDFLAGS: "-llightcraft_ios -lc++ -lz -lresolv -framework Security -framework SystemConfiguration -framework CoreFoundation"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
