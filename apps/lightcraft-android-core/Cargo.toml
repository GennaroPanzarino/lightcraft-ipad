[package]
name = "lightcraft-android-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "LightCraft's engine for the Android tethering app: the command API, loupe renders into a direct buffer, JPEG export (JNI)"

[lib]
name = "lightcraft_android"
crate-type = ["cdylib", "rlib"]

[dependencies]
lightcraft-engine = { workspace = true }
lightcraft-pipeline = { workspace = true }
serde_json = { workspace = true }
rayon = { workspace = true }
log = { workspace = true }
jni = { version = "0.21", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = { version = "0.14", default-features = false }
libc = { workspace = true }
